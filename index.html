<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="/tontine-app/manifest.json">
<meta name="theme-color" content="#E8A020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tontine Digital">
  <title>Tontine Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060E1A;font-family:'DM Sans',sans-serif;color:#EEF4FF}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0D1E30}
    ::-webkit-scrollbar-thumb{background:#E8A020;border-radius:2px}
    input,select,textarea{font-family:'DM Sans',sans-serif}
    input::placeholder,textarea::placeholder{color:#6B8BAA}
    select option{background:#0D1E30}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── TOKENS ── */
const C = {
  bg:'#060E1A', card:'#0D1E30', border:'#15304A',
  gold:'#E8A020', goldL:'#FFD080',
  green:'#00C896', red:'#FF4D6A', blue:'#1E90D4',
  text:'#EEF4FF', sub:'#6B8BAA',
  wave:'#00B4D8', orange:'#FF6B35', mtn:'#FFCC00',
};
const API_BASE = 'https://tontine-digital-backend-2.onrender.com/api';
const fmt  = n => Number(n||0).toLocaleString('fr-FR')+' FCFA';
const fmtS = n => { n=Number(n||0); if(n>=1000000) return (n/1e6).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(0)+'k'; return n; };

/* ── API ── */
const getToken = () => localStorage.getItem('td_token');
const saveToken = t => localStorage.setItem('td_token', t);
const removeToken = () => localStorage.removeItem('td_token');

 const api = async (method, path, body=null) => {
  const opts = { method, headers: {'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`} };
  if(body) opts.body = JSON.stringify(body);
  const url = 'https://tontine-digital-backend-2.onrender.com' + path;
  const res = await fetch(url, opts);
  const data = await res.json();
  if(!res.ok) throw new Error(data.message||'Erreur serveur');
  return data;
};

/* ── COMPOSANTS ── */
const Card = ({children, style, onClick}) => (
  <div onClick={onClick} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,cursor:onClick?'pointer':'default',...style}}>
    {children}
  </div>
);

const Btn = ({children, onClick, color, outline, style, disabled}) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding:'13px 20px', borderRadius:12, cursor:disabled?'not-allowed':'pointer',
    border: outline?`1.5px solid ${color||C.gold}`:'none',
    background: outline?'transparent':`linear-gradient(135deg,${color||C.gold},${color?color+'bb':'#b87000'})`,
    color: outline?(color||C.gold):(color===C.green?'#fff':C.bg),
    fontWeight:800, fontSize:14, fontFamily:'Syne,sans-serif',
    opacity:disabled?0.6:1, width:'100%', transition:'opacity .2s', ...style,
  }}>{children}</button>
);

const Inp = ({label, value, onChange, type='text', placeholder, style}) => (
  <div style={{marginBottom:14,...style}}>
    {label && <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>{label}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none',boxSizing:'border-box'}}/>
  </div>
);

const Badge = ({status}) => {
  const m = {active:{l:'Actif',c:C.green},paused:{l:'Pause',c:C.gold},completed:{l:'Confirmé',c:C.green},failed:{l:'Échoué',c:C.red},pending:{l:'En attente',c:C.gold},processing:{l:'En cours',c:C.blue}};
  const s = m[status]||{l:status,c:C.sub};
  return <span style={{padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700,background:s.c+'25',color:s.c}}>{s.l}</span>;
};

const Toast = ({msg,type}) => (
  <div style={{position:'fixed',top:20,left:'50%',transform:'translateX(-50%)',background:type==='error'?C.red:C.green,color:'#fff',padding:'12px 24px',borderRadius:12,fontWeight:700,fontSize:13,zIndex:9999,boxShadow:`0 8px 32px ${(type==='error'?C.red:C.green)}50`,whiteSpace:'nowrap',animation:'fadeIn .3s ease'}}>
    {msg}
  </div>
);

const Loader = () => (
  <div style={{display:'flex',justifyContent:'center',padding:40}}>
    <div style={{width:32,height:32,border:`3px solid ${C.border}`,borderTopColor:C.gold,borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
  </div>
);

/* ── SPLASH ── */
const Splash = () => (
  <div style={{minHeight:'100vh',background:`radial-gradient(ellipse at 30% 20%,#0d2240 0%,${C.bg} 65%)`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
    <div style={{width:100,height:100,borderRadius:26,background:`linear-gradient(135deg,${C.gold},#b87000)`,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:`0 24px 80px ${C.gold}50`,fontSize:52,animation:'pulse 1.5s ease-in-out infinite'}}>🤝</div>
    <h1 style={{color:C.text,fontSize:42,fontWeight:900,fontFamily:'Syne,sans-serif',letterSpacing:-2,margin:'0 0 6px'}}>TONTINE</h1>
    <span style={{color:C.gold,fontSize:14,letterSpacing:8,fontWeight:700}}>DIGITAL</span>
    <p style={{color:C.sub,marginTop:40,fontSize:13}}>Chargement…</p>
  </div>
);

/* ── AUTH ── */
const Auth = ({onLogin}) => {
  const [tab,setTab] = useState('login');
  const [name,setName] = useState('');
  const [phone,setPhone] = useState('');
  const [email,setEmail] = useState('');
  const [pwd,setPwd] = useState('');
  const [loading,setLoading] = useState(false);
  const [toast,setToast] = useState(null);
  const showT = (msg,type='success') => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const handleLogin = async () => {
    if(!phone||!pwd) return showT('Remplissez tous les champs','error');
    setLoading(true);
    try { const r=await api('POST','/api/auth/login',{phone,password:pwd}); saveToken(r.access_token); onLogin(r.user); }
    catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };
  const handleSignup = async () => {
    if(!name||!phone||!pwd) return showT('Nom, téléphone et mot de passe obligatoires','error');
    setLoading(true);
    try { const r=await api('POST','/api/auth/signup',{name,phone,password:pwd,email}); saveToken(r.access_token); onLogin(r.user); }
    catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:'100vh',background:`radial-gradient(ellipse at 40% 10%,#0d2240 0%,${C.bg} 65%)`,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      {toast && <Toast {...toast}/>}
      <div style={{width:'100%',maxWidth:420,animation:'fadeIn .5s ease'}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{width:72,height:72,borderRadius:20,background:`linear-gradient(135deg,${C.gold},#b87000)`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px',fontSize:34,boxShadow:`0 16px 48px ${C.gold}40`}}>🤝</div>
          <h1 style={{color:C.text,fontSize:30,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 6px'}}>TONTINE DIGITAL</h1>
          <p style={{color:C.sub,fontSize:13}}>L'épargne collective, réinventée</p>
        </div>
        <Card style={{padding:28}}>
          <div style={{display:'flex',gap:8,marginBottom:22}}>
            {[['login','Connexion'],['signup','Inscription']].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:'10px',background:tab===id?C.gold:'transparent',border:`1.5px solid ${tab===id?C.gold:C.border}`,borderRadius:10,color:tab===id?C.bg:C.sub,fontWeight:800,cursor:'pointer',fontSize:13,fontFamily:'Syne,sans-serif'}}>
                {label}
              </button>
            ))}
          </div>
          {tab==='login' ? (
            <>
              <Inp label="Numéro de téléphone" value={phone} onChange={setPhone} placeholder="Ex: 0621234567" type="tel"/>
              <Inp label="Mot de passe" value={pwd} onChange={setPwd} placeholder="Votre mot de passe" type="password"/>
              <Btn onClick={handleLogin} disabled={loading}>{loading?'Connexion…':'Se connecter →'}</Btn>
            </>
          ) : (
            <>
              <Inp label="Nom complet" value={name} onChange={setName} placeholder="Jean Dupont"/>
              <Inp label="Numéro de téléphone" value={phone} onChange={setPhone} placeholder="Ex: 0621234567" type="tel"/>
              <Inp label="Email (optionnel)" value={email} onChange={setEmail} placeholder="jean@email.com" type="email"/>
              <Inp label="Mot de passe" value={pwd} onChange={setPwd} placeholder="Min. 6 caractères" type="password"/>
              <Btn onClick={handleSignup} color={C.green} disabled={loading}>{loading?'Création…':'Créer mon compte →'}</Btn>
            </>
          )}
        </Card>
        <p style={{color:C.sub,textAlign:'center',fontSize:11,marginTop:16}}>🔒 Paiements sécurisés via Wave · Orange Money · MTN MoMo</p>
      </div>
    </div>
  );
};

/* ── SIDEBAR ── */
const Sidebar = ({active,setActive,user,onLogout}) => {
  const items = [{id:'dashboard',icon:'⊞',label:'Tableau de bord'},{id:'tontines',icon:'◎',label:'Mes Tontines'},{id:'paiements',icon:'↕',label:'Paiements'},{id:'admin',icon:'🔑',label:'Administration'}];
  return (
    <div style={{width:220,background:C.card,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',minHeight:'100vh',position:'sticky',top:0,flexShrink:0}}>
      <div style={{padding:'22px 18px',borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:38,height:38,borderRadius:10,background:`linear-gradient(135deg,${C.gold},#b87000)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🤝</div>
          <div><p style={{color:C.text,fontWeight:900,margin:0,fontSize:13,fontFamily:'Syne,sans-serif'}}>TONTINE</p><p style={{color:C.gold,fontWeight:700,margin:0,fontSize:8,letterSpacing:3}}>DIGITAL</p></div>
        </div>
      </div>
      <div style={{flex:1,padding:'14px 8px'}}>
        {items.map(item=>(
          <button key={item.id} onClick={()=>setActive(item.id)} style={{width:'100%',display:'flex',gap:10,alignItems:'center',padding:'10px 12px',background:active===item.id?C.gold+'18':'none',border:'none',borderRadius:10,cursor:'pointer',color:active===item.id?C.gold:C.sub,fontWeight:active===item.id?700:400,fontSize:13,marginBottom:3,textAlign:'left',fontFamily:'DM Sans,sans-serif'}}>
            <span style={{fontSize:17}}>{item.icon}</span>{item.label}
          </button>
        ))}
      </div>
      <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <div style={{width:34,height:34,borderRadius:'50%',background:`linear-gradient(135deg,${C.gold},#b87000)`,display:'flex',alignItems:'center',justifyContent:'center',color:C.bg,fontWeight:900,fontSize:13,flexShrink:0}}>{user?.name?.[0]||'?'}</div>
          <div style={{overflow:'hidden'}}>
            <p style={{color:C.text,fontWeight:700,margin:0,fontSize:12,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user?.name}</p>
            <p style={{color:C.sub,margin:0,fontSize:10}}>{user?.phone}</p>
          </div>
        </div>
        <button onClick={onLogout} style={{width:'100%',padding:'8px',background:C.red+'18',border:`1px solid ${C.red}30`,borderRadius:9,color:C.red,fontWeight:700,cursor:'pointer',fontSize:12}}>Déconnexion</button>
      </div>
    </div>
  );
};

/* ── DASHBOARD ── */
const Dashboard = ({user,setActive}) => {
  const [tontines,setTontines] = useState([]);
  const [transactions,setTransactions] = useState([]);
  const [loading,setLoading] = useState(true);

  useEffect(()=>{
    Promise.all([api('GET','/api/tontines'),api('GET','/api/payments/history')])
      .then(([t,p])=>{setTontines(t);setTransactions(p);})
      .catch(()=>{}).finally(()=>setLoading(false));
  },[]);

  const total = tontines.reduce((a,t)=>a+(t.total_collected||0),0);

  return (
    <div style={{padding:'28px 28px',maxWidth:900,animation:'fadeIn .4s ease'}}>
      <div style={{marginBottom:24}}>
        <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 4px'}}>Bonsoir, {user?.name?.split(' ')[0]} 👋</h1>
        <p style={{color:C.sub,fontSize:13,margin:0}}>Voici votre résumé Tontine Digital</p>
      </div>
      {loading ? <Loader/> : <>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:24}}>
          {[[`💰`,'Épargne totale',fmt(total),C.gold],[`◎`,'Tontines actives',tontines.filter(t=>t.status==='active').length,C.green],[`↕`,'Transactions',transactions.length,C.blue]].map(([icon,label,val,color])=>(
            <Card key={label} style={{padding:'18px 20px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <p style={{color:C.sub,fontSize:10,margin:'0 0 5px',textTransform:'uppercase',letterSpacing:.5}}>{label}</p>
                  <p style={{color:color,fontSize:22,fontWeight:900,margin:0,fontFamily:'Syne,sans-serif'}}>{val}</p>
                </div>
                <div style={{width:40,height:40,borderRadius:10,background:color+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{icon}</div>
              </div>
            </Card>
          ))}
        </div>
        <div style={{display:'flex',gap:10,marginBottom:24}}>
          <Btn onClick={()=>setActive('tontines')} style={{flex:1}}>+ Créer une tontine</Btn>
          <Btn onClick={()=>setActive('paiements')} color={C.green} style={{flex:1}}>↑ Payer une cotisation</Btn>
        </div>
        <h2 style={{color:C.text,fontSize:15,fontWeight:700,fontFamily:'Syne,sans-serif',margin:'0 0 12px'}}>Mes Tontines</h2>
        {tontines.length===0
          ? <Card style={{padding:40,textAlign:'center'}}><p style={{color:C.sub}}>Aucune tontine — créez-en une !</p></Card>
          : <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,marginBottom:24}}>
              {tontines.slice(0,4).map(t=>(
                <Card key={t.id} style={{padding:'16px 18px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <div><p style={{color:C.text,fontWeight:700,margin:0}}>{t.name}</p><p style={{color:C.sub,fontSize:11,margin:0}}>{t.member_count} membres · {t.frequency}</p></div>
                    <Badge status={t.status}/>
                  </div>
                  <p style={{color:C.gold,fontWeight:900,fontSize:18,fontFamily:'Syne,sans-serif',margin:'0 0 8px'}}>{fmt(t.total_collected)}</p>
                  <div style={{background:C.border,borderRadius:3,height:4}}><div style={{background:`linear-gradient(90deg,${C.gold},${C.goldL})`,width:`${Math.min(((t.current_tour||1)/(t.total_tours||1))*100,100)}%`,height:'100%',borderRadius:3}}/></div>
                  <p style={{color:C.sub,fontSize:10,margin:'4px 0 0'}}>Tour {t.current_tour||1} / {t.total_tours||1}</p>
                </Card>
              ))}
            </div>
        }
        <h2 style={{color:C.text,fontSize:15,fontWeight:700,fontFamily:'Syne,sans-serif',margin:'0 0 12px'}}>Transactions récentes</h2>
        {transactions.length===0
          ? <Card style={{padding:32,textAlign:'center'}}><p style={{color:C.sub}}>Aucune transaction</p></Card>
          : transactions.slice(0,5).map(t=>(
            <Card key={t.id} style={{padding:'12px 16px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <div style={{width:36,height:36,borderRadius:'50%',background:(t.status==='completed'?C.green:C.red)+'20',display:'flex',alignItems:'center',justifyContent:'center',color:t.status==='completed'?C.green:C.red,fontSize:16}}>{t.status==='completed'?'✓':'✗'}</div>
                <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{t.description||'Cotisation'}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{t.payment_method?.toUpperCase()} · {new Date(t.initiated_at).toLocaleDateString('fr-FR')}</p></div>
              </div>
              <div style={{textAlign:'right'}}><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{fmt(t.amount)}</p><Badge status={t.status}/></div>
            </Card>
          ))
        }
      </>}
    </div>
  );
};

/* ── TONTINES ── */
const Tontines = () => {
  const [tontines,setTontines] = useState([]);
  const [loading,setLoading] = useState(true);
  const [showCreate,setShowCreate] = useState(false);
  const [selected,setSelected] = useState(null);
  const [toast,setToast] = useState(null);
  const [form,setForm] = useState({name:'',amount:'',frequency:'Mensuel',total_tours:'',description:''});
  const showT = (msg,type='success') => {setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  const load = useCallback(async()=>{setLoading(true);try{setTontines(await api('GET','/api/tontines'));}catch(e){}setLoading(false);},[]);
  useEffect(()=>{load();},[load]);

  const handleCreate = async () => {
    if(!form.name||!form.amount) return showT('Nom et montant obligatoires','error');
    try { await api('POST','/api/tontines',{...form,amount:parseFloat(form.amount),total_tours:parseInt(form.total_tours)||1}); showT('Tontine créée !'); setShowCreate(false); setForm({name:'',amount:'',frequency:'Mensuel',total_tours:'',description:''}); load(); }
    catch(e) { showT(e.message,'error'); }
  };
  const loadDetail = async id => { try{setSelected(await api('GET',`/api/tontines/${id}`));}catch(e){showT('Erreur','error');} };

  if(selected) return (
    <div style={{padding:'28px 28px',maxWidth:800,animation:'fadeIn .4s ease'}}>
      {toast&&<Toast {...toast}/>}
      <button onClick={()=>setSelected(null)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:9,padding:'7px 14px',color:C.text,cursor:'pointer',marginBottom:18,fontSize:13}}>← Retour</button>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <h1 style={{color:C.text,fontSize:22,fontWeight:900,fontFamily:'Syne,sans-serif',margin:0}}>{selected.name}</h1>
        <Badge status={selected.status}/>
      </div>
      <Card style={{padding:'18px 22px',background:`linear-gradient(135deg,${C.gold},#b87000)`,border:'none',marginBottom:18}}>
        <p style={{color:'#5a3800',fontSize:10,margin:'0 0 3px',textTransform:'uppercase',letterSpacing:1}}>CAGNOTTE TOTALE</p>
        <h2 style={{color:C.bg,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 10px'}}>{fmt(selected.total_collected)}</h2>
        <div style={{display:'flex',gap:20}}>
          {[['Cotisation',fmt(selected.amount)],['Fréquence',selected.frequency],['Membres',selected.member_count],['Tour',`${selected.current_tour}/${selected.total_tours}`]].map(([l,v])=>(
            <div key={l}><p style={{color:'#5a3800',fontSize:9,margin:0}}>{l}</p><p style={{color:C.bg,fontWeight:800,margin:0,fontSize:13}}>{v}</p></div>
          ))}
        </div>
      </Card>
      <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 10px',fontSize:14}}>Membres ({selected.members?.length||0})</h3>
      {(selected.members||[]).map(m=>(
        <Card key={m.id} style={{padding:'11px 14px',marginBottom:7,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',gap:9,alignItems:'center'}}>
            <div style={{width:34,height:34,borderRadius:'50%',background:C.blue+'25',display:'flex',alignItems:'center',justifyContent:'center',color:C.text,fontWeight:700,fontSize:13}}>{m.name?.[0]}</div>
            <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{m.name}</p><p style={{color:C.sub,fontSize:10,margin:0}}>Tour #{m.tour_number} · {m.phone}</p></div>
          </div>
          <Badge status={m.has_paid?'completed':'pending'}/>
        </Card>
      ))}
    </div>
  );

  return (
    <div style={{padding:'28px 28px',maxWidth:900,animation:'fadeIn .4s ease'}}>
      {toast&&<Toast {...toast}/>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:22}}>
        <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:0}}>Mes Tontines</h1>
        <Btn onClick={()=>setShowCreate(!showCreate)} style={{width:'auto',padding:'10px 18px'}}>+ Créer</Btn>
      </div>
      {showCreate && (
        <Card style={{padding:22,marginBottom:20}}>
          <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Nouveau groupe</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Inp label="Nom du groupe" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Ex: Famille Diallo"/>
            <Inp label="Montant/tour (FCFA)" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} placeholder="Ex: 50000" type="number"/>
            <Inp label="Nombre de tours" value={form.total_tours} onChange={v=>setForm(f=>({...f,total_tours:v}))} placeholder="Ex: 8" type="number"/>
            <div style={{marginBottom:14}}>
              <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>Fréquence</label>
              <select value={form.frequency} onChange={e=>setForm(f=>({...f,frequency:e.target.value}))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none'}}>
                {['Hebdomadaire','Mensuel','Trimestriel'].map(f=><option key={f}>{f}</option>)}
              </select>
            </div>
          </div>
          <Inp label="Description (optionnel)" value={form.description} onChange={v=>setForm(f=>({...f,description:v}))} placeholder="Objectif du groupe…"/>
          <div style={{display:'flex',gap:8}}><Btn onClick={handleCreate} color={C.green}>✓ Créer</Btn><Btn onClick={()=>setShowCreate(false)} outline>Annuler</Btn></div>
        </Card>
      )}
      {loading ? <Loader/> : tontines.length===0
        ? <Card style={{padding:60,textAlign:'center'}}><p style={{fontSize:40,marginBottom:10}}>◎</p><p style={{color:C.sub}}>Aucune tontine — créez-en une !</p></Card>
        : <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
            {tontines.map(t=>(
              <Card key={t.id} onClick={()=>loadDetail(t.id)} style={{padding:'16px 18px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{display:'flex',gap:9,alignItems:'center'}}>
                    <div style={{width:40,height:40,borderRadius:11,background:C.gold+'20',display:'flex',alignItems:'center',justifyContent:'center',color:C.gold,fontWeight:900,fontSize:17}}>{t.name?.[0]}</div>
                    <div><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{t.name}</p><p style={{color:C.sub,fontSize:11,margin:0}}>{t.member_count} membres · {t.frequency}</p></div>
                  </div>
                  <Badge status={t.status}/>
                </div>
                <p style={{color:C.gold,fontWeight:900,fontSize:18,fontFamily:'Syne,sans-serif',margin:'0 0 8px'}}>{fmt(t.total_collected)}</p>
                <div style={{background:C.border,borderRadius:3,height:4}}><div style={{background:`linear-gradient(90deg,${C.gold},${C.goldL})`,width:`${Math.min(((t.current_tour||1)/(t.total_tours||1))*100,100)}%`,height:'100%',borderRadius:3}}/></div>
                <p style={{color:C.sub,fontSize:10,margin:'4px 0 0'}}>Tour {t.current_tour||1} / {t.total_tours||1}</p>
              </Card>
            ))}
          </div>
      }
    </div>
  );
};

/* ── PAIEMENTS ── */
const ADMIN = {wave:'0747429889',orange:'0555471974',mtn:'0747429889'};
const Paiements = ({user}) => {
  const [tab,setTab] = useState('payer');
  const [tontines,setTontines] = useState([]);
  const [transactions,setTransactions] = useState([]);
  const [loading,setLoading] = useState(false);
  const [toast,setToast] = useState(null);
  const [step,setStep] = useState(1);
  const [form,setForm] = useState({tontine_id:'',amount:'',payment_method:'wave',phone_number:''});
  const showT = (msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),4000);};

  useEffect(()=>{
    Promise.all([api('GET','/api/tontines'),api('GET','/api/payments/history')])
      .then(([t,p])=>{setTontines(t);setTransactions(p);}).catch(()=>{});
  },[]);

  const handlePay = async () => {
    if(!form.amount||!form.phone_number) return showT('Remplissez tous les champs','error');
    setLoading(true);
    try {
      const r = await api('POST','/api/payments/initiate',{...form,amount:parseFloat(form.amount),tontine_id:form.tontine_id||null});
      showT(`✅ ${r.message}`); setStep(1); setForm({tontine_id:'',amount:'',payment_method:'wave',phone_number:''});
      const p = await api('GET','/api/payments/history'); setTransactions(p); setTab('historique');
    } catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };

  return (
    <div style={{padding:'28px 28px',maxWidth:860,animation:'fadeIn .4s ease'}}>
      {toast&&<Toast {...toast}/>}
      <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 22px'}}>Paiements</h1>
      <div style={{display:'flex',gap:8,marginBottom:22}}>
        {[['payer','↑ Payer une cotisation'],['historique','📋 Historique']].map(([id,label])=>(
          <button key={id} onClick={()=>{setTab(id);setStep(1);}} style={{padding:'9px 18px',background:tab===id?C.gold:C.card,border:`1.5px solid ${tab===id?C.gold:C.border}`,borderRadius:10,color:tab===id?C.bg:C.sub,fontWeight:700,cursor:'pointer',fontSize:13}}>{label}</button>
        ))}
      </div>

      {tab==='payer' && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22,alignItems:'start'}}>
          <Card style={{padding:22}}>
            <div style={{display:'flex',gap:5,marginBottom:20}}>
              {[1,2,3].map(s=><div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?C.gold:C.border}}/>)}
            </div>
            {step===1 && <>
              <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Montant & Groupe</h3>
              <div style={{marginBottom:14}}>
                <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>Groupe (optionnel)</label>
                <select value={form.tontine_id} onChange={e=>setForm(f=>({...f,tontine_id:e.target.value,amount:tontines.find(t=>String(t.id)===e.target.value)?.amount||f.amount}))} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none'}}>
                  <option value="">Paiement libre</option>
                  {tontines.map(t=><option key={t.id} value={t.id}>{t.name} — {fmt(t.amount)}</option>)}
                </select>
              </div>
              <Inp label="Montant (FCFA)" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} placeholder="Ex: 50000" type="number"/>
              <Btn onClick={()=>{if(!form.amount)return showT('Entrez un montant','error');setStep(2);}}>Suivant →</Btn>
            </>}
            {step===2 && <>
              <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Méthode de paiement</h3>
              {[{id:'wave',label:'Wave',color:C.wave,icon:'〰',num:ADMIN.wave},{id:'orange',label:'Orange Money',color:C.orange,icon:'◍',num:ADMIN.orange},{id:'mtn',label:'MTN MoMo',color:C.mtn,icon:'◈',num:ADMIN.mtn}].map(m=>(
                <div key={m.id} onClick={()=>setForm(f=>({...f,payment_method:m.id}))} style={{background:form.payment_method===m.id?m.color+'15':C.bg,border:`1.5px solid ${form.payment_method===m.id?m.color:C.border}`,borderRadius:11,padding:'12px 14px',marginBottom:8,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div style={{display:'flex',gap:9,alignItems:'center'}}>
                    <div style={{width:34,height:34,borderRadius:9,background:m.color+'25',display:'flex',alignItems:'center',justifyContent:'center',color:m.color,fontSize:17}}>{m.icon}</div>
                    <div><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{m.label}</p><p style={{color:C.sub,fontSize:10,margin:0}}>Admin: {m.num}</p></div>
                  </div>
                  <div style={{width:16,height:16,borderRadius:'50%',border:`2px solid ${form.payment_method===m.id?m.color:C.border}`,background:form.payment_method===m.id?m.color:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {form.payment_method===m.id && <div style={{width:7,height:7,borderRadius:'50%',background:C.bg}}/>}
                  </div>
                </div>
              ))}
              <Inp label="Votre numéro de téléphone" value={form.phone_number} onChange={v=>setForm(f=>({...f,phone_number:v}))} placeholder="Ex: 0621234567" type="tel"/>
              <div style={{display:'flex',gap:8}}><Btn onClick={()=>setStep(1)} outline style={{flex:1}}>←</Btn><Btn onClick={()=>{if(!form.phone_number)return showT('Entrez votre numéro','error');setStep(3);}} style={{flex:2}}>Suivant →</Btn></div>
            </>}
            {step===3 && <>
              <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Confirmer</h3>
              <Card style={{padding:14,marginBottom:12,background:C.bg}}>
                {[['Montant',fmt(form.amount)],['Méthode',form.payment_method?.toUpperCase()],['Compte admin',ADMIN[form.payment_method]],['Votre numéro',form.phone_number],['Frais','0 FCFA']].map(([l,v])=>(
                  <div key={l} style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{color:C.sub,fontSize:12}}>{l}</span><span style={{color:C.text,fontWeight:700,fontSize:12}}>{v}</span></div>
                ))}
                <div style={{borderTop:`1px solid ${C.border}`,paddingTop:9,display:'flex',justifyContent:'space-between'}}><span style={{color:C.text,fontWeight:800}}>Total</span><span style={{color:C.gold,fontWeight:900,fontSize:15}}>{fmt(form.amount)}</span></div>
              </Card>
              <div style={{background:C.blue+'12',border:`1px solid ${C.blue}30`,borderRadius:9,padding:10,marginBottom:12}}><p style={{color:C.blue,fontSize:11,margin:0}}>ℹ️ Paiement vers {form.payment_method?.toUpperCase()} : <strong>{ADMIN[form.payment_method]}</strong></p></div>
              <div style={{display:'flex',gap:8}}><Btn onClick={()=>setStep(2)} outline style={{flex:1}}>←</Btn><Btn onClick={handlePay} color={C.green} disabled={loading} style={{flex:2}}>{loading?'Traitement…':'✓ Confirmer'}</Btn></div>
            </>}
          </Card>
          <Card style={{padding:18}}>
            <p style={{color:C.text,fontWeight:700,fontFamily:'Syne,sans-serif',margin:'0 0 10px',fontSize:14}}>Comptes administrateur</p>
            {[{m:'Wave',n:ADMIN.wave,c:C.wave},{m:'Orange',n:ADMIN.orange,c:C.orange},{m:'MTN',n:ADMIN.mtn,c:C.mtn}].map(a=>(
              <div key={a.m} style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{color:C.sub,fontSize:12}}>{a.m}</span><span style={{color:a.c,fontWeight:700,fontSize:13}}>{a.n}</span></div>
            ))}
            <div style={{marginTop:12,background:C.green+'10',border:`1px solid ${C.green}20`,borderRadius:9,padding:10}}><p style={{color:C.green,fontSize:11,margin:0}}>✓ Paiements automatiquement routés vers les comptes admin. Frais : 0%</p></div>
          </Card>
        </div>
      )}

      {tab==='historique' && (transactions.length===0
        ? <Card style={{padding:50,textAlign:'center'}}><p style={{color:C.sub}}>Aucune transaction pour le moment</p></Card>
        : transactions.map(t=>(
          <Card key={t.id} style={{padding:'13px 16px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <div style={{width:38,height:38,borderRadius:'50%',background:(t.status==='completed'?C.green:C.red)+'20',display:'flex',alignItems:'center',justifyContent:'center',color:t.status==='completed'?C.green:C.red,fontSize:17}}>{t.status==='completed'?'✓':'✗'}</div>
              <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{t.reference}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{t.payment_method?.toUpperCase()} → {t.receiver_phone}</p></div>
            </div>
            <div style={{textAlign:'right'}}><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{fmt(t.amount)}</p><Badge status={t.status}/></div>
          </Card>
        ))
      )}
    </div>
  );
};

/* ── ADMIN ── */
const Admin = () => {
  const [stats,setStats] = useState(null);
  const [users,setUsers] = useState([]);
  const [transactions,setTransactions] = useState([]);
  const [loading,setLoading] = useState(true);
  const [tab,setTab] = useState('stats');

  useEffect(()=>{
    Promise.all([api('GET','/api/admin/stats'),api('GET','/api/admin/users'),api('GET','/api/admin/transactions')])
      .then(([s,u,t])=>{setStats(s);setUsers(u);setTransactions(t);})
      .catch(()=>{}).finally(()=>setLoading(false));
  },[]);

  return (
    <div style={{padding:'28px 28px',maxWidth:960,animation:'fadeIn .4s ease'}}>
      <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 22px'}}>Administration</h1>
      <div style={{display:'flex',gap:8,marginBottom:22}}>
        {[['stats','Vue d\'ensemble'],['users','Utilisateurs'],['transactions','Transactions']].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{padding:'9px 16px',background:tab===id?C.gold:C.card,border:`1.5px solid ${tab===id?C.gold:C.border}`,borderRadius:10,color:tab===id?C.bg:C.sub,fontWeight:700,cursor:'pointer',fontSize:13}}>{label}</button>
        ))}
      </div>
      {loading ? <Loader/> : <>
        {tab==='stats' && stats && <>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:22}}>
            {[['👥','Utilisateurs',stats.total_users,C.blue],['◎','Tontines actives',stats.active_tontines,C.green],['↕','Transactions',stats.total_transactions,C.gold],['💰','Volume',fmtS(stats.total_amount)+' FCFA',C.red]].map(([icon,label,val,color])=>(
              <Card key={label} style={{padding:'14px 16px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}><p style={{color:C.sub,fontSize:9,margin:0,textTransform:'uppercase',letterSpacing:.5}}>{label}</p><span style={{fontSize:16}}>{icon}</span></div>
                <p style={{color,fontSize:20,fontWeight:900,fontFamily:'Syne,sans-serif',margin:0}}>{val}</p>
              </Card>
            ))}
          </div>
          <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 10px',fontSize:14}}>Comptes Admin</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
            {Object.entries(stats.admin_accounts||{}).map(([method,num])=>{
              const cols={wave:C.wave,orange:C.orange,mtn:C.mtn};
              return <Card key={method} style={{padding:'14px 16px'}}><p style={{color:C.sub,fontSize:9,margin:'0 0 4px',textTransform:'uppercase'}}>{method}</p><p style={{color:cols[method]||C.gold,fontWeight:900,fontSize:15,fontFamily:'Syne,sans-serif',margin:'0 0 5px'}}>{num}</p><span style={{fontSize:9,padding:'2px 7px',borderRadius:6,background:C.green+'20',color:C.green}}>ACTIF</span></Card>;
            })}
          </div>
        </>}
        {tab==='users' && <div>
          <p style={{color:C.sub,fontSize:13,marginBottom:12}}>{users.length} utilisateurs inscrits</p>
          {users.map(u=>(
            <Card key={u.id} style={{padding:'12px 14px',marginBottom:7,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{display:'flex',gap:9,alignItems:'center'}}>
                <div style={{width:36,height:36,borderRadius:'50%',background:C.blue+'25',display:'flex',alignItems:'center',justifyContent:'center',color:C.text,fontWeight:700,fontSize:14}}>{u.name?.[0]}</div>
                <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{u.name}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{u.phone}</p></div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}><p style={{color:C.sub,fontSize:10,margin:0}}>{new Date(u.created_at).toLocaleDateString('fr-FR')}</p><Badge status={u.is_active?'active':'paused'}/></div>
            </Card>
          ))}
        </div>}
        {tab==='transactions' && <div>
          <p style={{color:C.sub,fontSize:13,marginBottom:12}}>{transactions.length} transactions</p>
          {transactions.map(t=>(
            <Card key={t.id} style={{padding:'12px 14px',marginBottom:7}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}><p style={{color:C.sub,fontSize:9,margin:0,fontFamily:'monospace'}}>{t.reference}</p><Badge status={t.status}/></div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{t.user_name}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{t.payment_method?.toUpperCase()} → {t.receiver_phone}</p></div>
                <p style={{color:t.status==='completed'?C.green:C.red,fontWeight:900,fontSize:15,fontFamily:'Syne,sans-serif',margin:0}}>{fmt(t.amount)}</p>
              </div>
            </Card>
          ))}
        </div>}
      </>}
    </div>
  );
};

/* ── APP PRINCIPALE ── */
const App = () => {
  const [screen,setScreen] = useState('splash');
  const [user,setUser] = useState(null);
  const [active,setActive] = useState('dashboard');

  useEffect(()=>{
    setTimeout(async()=>{
      if(localStorage.getItem('td_token')){
        try{ const me=await api('GET','/api/auth/me'); setUser(me); setScreen('app'); return; }catch(e){ removeToken(); }
      }
      setScreen('auth');
    },1800);
  },[]);

  if(screen==='splash') return <Splash/>;
  if(screen==='auth') return <Auth onLogin={u=>{setUser(u);setScreen('app');}}/>;

  const panels = {
    dashboard:<Dashboard user={user} setActive={setActive}/>,
    tontines:<Tontines/>,
    paiements:<Paiements user={user}/>,
    admin:<Admin/>,
  };

  return (
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar active={active} setActive={setActive} user={user} onLogout={()=>{removeToken();setUser(null);setScreen('auth');}}/>
      <main style={{flex:1,overflowY:'auto',minHeight:'100vh'}}>{panels[active]}</main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
