<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tontine Digital</title>
  <link rel="manifest" href="/tontine-app/manifest.json">
  <meta name="theme-color" content="#E8A020">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060E1A;font-family:'DM Sans',sans-serif;color:#EEF4FF}
    input,select,textarea{font-family:'DM Sans',sans-serif}
    input::placeholder,textarea::placeholder{color:#6B8BAA}
    select option{background:#0D1E30}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const C = {
  bg:'#060E1A', card:'#0D1E30', border:'#15304A',
  gold:'#E8A020', goldL:'#FFD080',
  green:'#00C896', red:'#FF4D6A', blue:'#1E90D4',
  text:'#EEF4FF', sub:'#6B8BAA',
  wave:'#00B4D8', orange:'#FF6B35', mtn:'#FFCC00',
};

const BACKEND = 'https://tontine-digital-backend-2.onrender.com';
const fmt = n => Number(n||0).toLocaleString('fr-FR')+' FCFA';
const fmtS = n => { n=Number(n||0); if(n>=1000000) return (n/1e6).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(0)+'k'; return String(n); };

const getToken = () => localStorage.getItem('td_token');
const saveToken = t => localStorage.setItem('td_token', t);
const removeToken = () => localStorage.removeItem('td_token');

const api = async (method, path, body=null) => {
  try {
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (getToken()||'')
      }
    };
    if(body) opts.body = JSON.stringify(body);
    const res = await fetch(BACKEND + path, opts);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch(e) { throw new Error('Erreur de connexion au serveur'); }
    if(!res.ok) throw new Error(data.message || 'Erreur serveur');
    return data;
  } catch(e) {
    if(e.message === 'Failed to fetch') throw new Error('Serveur indisponible. Réessayez dans 1 minute.');
    throw e;
  }
};

const Card = ({children, style, onClick}) => (
  <div onClick={onClick} style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,cursor:onClick?'pointer':'default',...style}}>
    {children}
  </div>
);

const Btn = ({children, onClick, color, outline, style, disabled}) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding:'13px 20px', borderRadius:12, cursor:disabled?'not-allowed':'pointer',
    border: outline?'1.5px solid '+(color||C.gold):'none',
    background: outline?'transparent':'linear-gradient(135deg,'+(color||C.gold)+','+(color?color+'bb':'#b87000')+')',
    color: outline?(color||C.gold):(color===C.green?'#fff':C.bg),
    fontWeight:800, fontSize:14, fontFamily:'Syne,sans-serif',
    opacity:disabled?0.6:1, width:'100%', transition:'opacity .2s', ...style,
  }}>{children}</button>
);

const Inp = ({label, value, onChange, type, placeholder}) => (
  <div style={{marginBottom:14}}>
    {label && <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>{label}</label>}
    <input type={type||'text'} value={value} onChange={function(e){onChange(e.target.value);}} placeholder={placeholder}
      style={{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none',boxSizing:'border-box'}}/>
  </div>
);

const Badge = ({status}) => {
  const m = {active:{l:'Actif',c:C.green},paused:{l:'Pause',c:C.gold},completed:{l:'Confirmé',c:C.green},failed:{l:'Échoué',c:C.red},pending:{l:'En attente',c:C.gold}};
  const s = m[status]||{l:status,c:C.sub};
  return React.createElement('span',{style:{padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700,background:s.c+'25',color:s.c}},s.l);
};

const Toast = ({msg,type}) => (
  <div style={{position:'fixed',top:20,left:'50%',transform:'translateX(-50%)',background:type==='error'?C.red:C.green,color:'#fff',padding:'12px 24px',borderRadius:12,fontWeight:700,fontSize:13,zIndex:9999,maxWidth:'90vw',textAlign:'center'}}>
    {msg}
  </div>
);

const Loader = () => (
  <div style={{display:'flex',justifyContent:'center',padding:40}}>
    <div style={{width:32,height:32,border:'3px solid '+C.border,borderTopColor:C.gold,borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
  </div>
);

const Splash = () => (
  <div style={{minHeight:'100vh',background:'radial-gradient(ellipse at 30% 20%,#0d2240 0%,'+C.bg+' 65%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
    <div style={{width:100,height:100,borderRadius:26,background:'linear-gradient(135deg,'+C.gold+',#b87000)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,fontSize:52,animation:'pulse 1.5s ease-in-out infinite'}}>🤝</div>
    <h1 style={{color:C.text,fontSize:42,fontWeight:900,fontFamily:'Syne,sans-serif',letterSpacing:-2,margin:'0 0 6px'}}>TONTINE</h1>
    <span style={{color:C.gold,fontSize:14,letterSpacing:8,fontWeight:700}}>DIGITAL</span>
    <p style={{color:C.sub,marginTop:40,fontSize:13}}>Chargement…</p>
  </div>
);

const Auth = ({onLogin}) => {
  const [tab,setTab] = useState('login');
  const [name,setName] = useState('');
  const [phone,setPhone] = useState('');
  const [email,setEmail] = useState('');
  const [pwd,setPwd] = useState('');
  const [loading,setLoading] = useState(false);
  const [toast,setToast] = useState(null);
  const showT = function(msg,type) { setToast({msg,type:type||'success'}); setTimeout(function(){setToast(null);},4000); };

  const handleLogin = async function() {
    if(!phone||!pwd) return showT('Remplissez tous les champs','error');
    setLoading(true);
    try {
      const r = await api('POST','/api/auth/login',{phone:phone,password:pwd});
      saveToken(r.access_token);
      onLogin(r.user);
    } catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };

  const handleSignup = async function() {
    if(!name||!phone||!pwd) return showT('Nom, téléphone et mot de passe obligatoires','error');
    if(pwd.length < 6) return showT('Mot de passe minimum 6 caractères','error');
    setLoading(true);
    try {
      const r = await api('POST','/api/auth/signup',{name:name,phone:phone,password:pwd,email:email});
      saveToken(r.access_token);
      onLogin(r.user);
    } catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:'100vh',background:'radial-gradient(ellipse at 40% 10%,#0d2240 0%,'+C.bg+' 65%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      {toast && <Toast msg={toast.msg} type={toast.type}/>}
      <div style={{width:'100%',maxWidth:420}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{width:72,height:72,borderRadius:20,background:'linear-gradient(135deg,'+C.gold+',#b87000)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px',fontSize:34}}>🤝</div>
          <h1 style={{color:C.text,fontSize:30,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 6px'}}>TONTINE DIGITAL</h1>
          <p style={{color:C.sub,fontSize:13}}>L'épargne collective, réinventée</p>
        </div>
        <Card style={{padding:28}}>
          <div style={{display:'flex',gap:8,marginBottom:22}}>
            {[['login','Connexion'],['signup','Inscription']].map(function([id,label]){
              return <button key={id} onClick={function(){setTab(id);}} style={{flex:1,padding:'10px',background:tab===id?C.gold:'transparent',border:'1.5px solid '+(tab===id?C.gold:C.border),borderRadius:10,color:tab===id?C.bg:C.sub,fontWeight:800,cursor:'pointer',fontSize:13,fontFamily:'Syne,sans-serif'}}>{label}</button>;
            })}
          </div>
          {tab==='login' ? (
            <div>
              <Inp label="Numéro de téléphone" value={phone} onChange={setPhone} placeholder="Ex: 0621234567" type="tel"/>
              <Inp label="Mot de passe" value={pwd} onChange={setPwd} placeholder="Votre mot de passe" type="password"/>
              <Btn onClick={handleLogin} disabled={loading}>{loading?'Connexion…':'Se connecter →'}</Btn>
            </div>
          ) : (
            <div>
              <Inp label="Nom complet" value={name} onChange={setName} placeholder="Jean Dupont"/>
              <Inp label="Numéro de téléphone" value={phone} onChange={setPhone} placeholder="Ex: 0621234567" type="tel"/>
              <Inp label="Email (optionnel)" value={email} onChange={setEmail} placeholder="jean@email.com" type="email"/>
              <Inp label="Mot de passe (min. 6 caractères)" value={pwd} onChange={setPwd} placeholder="••••••" type="password"/>
              <Btn onClick={handleSignup} color={C.green} disabled={loading}>{loading?'Création…':'Créer mon compte →'}</Btn>
            </div>
          )}
        </Card>
        <p style={{color:C.sub,textAlign:'center',fontSize:11,marginTop:16}}>🔒 Paiements sécurisés via Wave · Orange Money · MTN MoMo</p>
      </div>
    </div>
  );
};

const Sidebar = ({active,setActive,user,onLogout}) => {
  const items = [
    {id:'dashboard',icon:'⊞',label:'Tableau de bord'},
    {id:'tontines',icon:'◎',label:'Mes Tontines'},
    {id:'paiements',icon:'↕',label:'Paiements'},
    {id:'admin',icon:'🔑',label:'Administration'},
  ];
  return (
    <div style={{width:220,background:C.card,borderRight:'1px solid '+C.border,display:'flex',flexDirection:'column',minHeight:'100vh',position:'sticky',top:0,flexShrink:0}}>
      <div style={{padding:'22px 18px',borderBottom:'1px solid '+C.border}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:38,height:38,borderRadius:10,background:'linear-gradient(135deg,'+C.gold+',#b87000)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🤝</div>
          <div>
            <p style={{color:C.text,fontWeight:900,margin:0,fontSize:13,fontFamily:'Syne,sans-serif'}}>TONTINE</p>
            <p style={{color:C.gold,fontWeight:700,margin:0,fontSize:8,letterSpacing:3}}>DIGITAL</p>
          </div>
        </div>
      </div>
      <div style={{flex:1,padding:'14px 8px'}}>
        {items.map(function(item){
          return <button key={item.id} onClick={function(){setActive(item.id);}} style={{width:'100%',display:'flex',gap:10,alignItems:'center',padding:'10px 12px',background:active===item.id?C.gold+'18':'none',border:'none',borderRadius:10,cursor:'pointer',color:active===item.id?C.gold:C.sub,fontWeight:active===item.id?700:400,fontSize:13,marginBottom:3,textAlign:'left',fontFamily:'DM Sans,sans-serif'}}>
            <span style={{fontSize:17}}>{item.icon}</span>{item.label}
          </button>;
        })}
      </div>
      <div style={{padding:'14px 16px',borderTop:'1px solid '+C.border}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <div style={{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,'+C.gold+',#b87000)',display:'flex',alignItems:'center',justifyContent:'center',color:C.bg,fontWeight:900,fontSize:13,flexShrink:0}}>{user&&user.name?user.name[0]:'?'}</div>
          <div style={{overflow:'hidden'}}>
            <p style={{color:C.text,fontWeight:700,margin:0,fontSize:12,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user&&user.name}</p>
            <p style={{color:C.sub,margin:0,fontSize:10}}>{user&&user.phone}</p>
          </div>
        </div>
        <button onClick={onLogout} style={{width:'100%',padding:'8px',background:C.red+'18',border:'1px solid '+C.red+'30',borderRadius:9,color:C.red,fontWeight:700,cursor:'pointer',fontSize:12}}>Déconnexion</button>
      </div>
    </div>
  );
};

const Dashboard = ({user,setActive}) => {
  const [tontines,setTontines] = useState([]);
  const [transactions,setTransactions] = useState([]);
  const [loading,setLoading] = useState(true);

  useEffect(function(){
    Promise.all([
      api('GET','/api/tontines').catch(function(){return [];}),
      api('GET','/api/payments/history').catch(function(){return [];})
    ]).then(function(results){
      var t=results[0]; var p=results[1];
      setTontines(Array.isArray(t)?t:[]);
      setTransactions(Array.isArray(p)?p:[]);
    }).finally(function(){setLoading(false);});
  },[]);

  const total = tontines.reduce(function(a,t){return a+(t.total_collected||0);},0);

  return (
    <div style={{padding:'28px',maxWidth:900}}>
      <div style={{marginBottom:24}}>
        <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 4px'}}>Bonsoir, {user&&user.name?user.name.split(' ')[0]:''} 👋</h1>
        <p style={{color:C.sub,fontSize:13,margin:0}}>Voici votre résumé Tontine Digital</p>
      </div>
      {loading ? <Loader/> : (
        <div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:24}}>
            {[['💰','Épargne totale',fmt(total),C.gold],['◎','Tontines actives',tontines.filter(function(t){return t.status==='active';}).length,C.green],['↕','Transactions',transactions.length,C.blue]].map(function(item){
              return <Card key={item[1]} style={{padding:'18px 20px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <p style={{color:C.sub,fontSize:10,margin:'0 0 5px',textTransform:'uppercase',letterSpacing:.5}}>{item[1]}</p>
                    <p style={{color:item[3],fontSize:22,fontWeight:900,margin:0,fontFamily:'Syne,sans-serif'}}>{item[2]}</p>
                  </div>
                  <div style={{width:40,height:40,borderRadius:10,background:item[3]+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{item[0]}</div>
                </div>
              </Card>;
            })}
          </div>
          <div style={{display:'flex',gap:10,marginBottom:24}}>
            <Btn onClick={function(){setActive('tontines');}} style={{flex:1}}>+ Créer une tontine</Btn>
            <Btn onClick={function(){setActive('paiements');}} color={C.green} style={{flex:1}}>↑ Payer une cotisation</Btn>
          </div>
          <h2 style={{color:C.text,fontSize:15,fontWeight:700,fontFamily:'Syne,sans-serif',margin:'0 0 12px'}}>Mes Tontines</h2>
          {tontines.length===0
            ? <Card style={{padding:40,textAlign:'center'}}><p style={{color:C.sub}}>Aucune tontine — créez-en une !</p></Card>
            : <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,marginBottom:24}}>
                {tontines.slice(0,4).map(function(t){
                  return <Card key={t.id} style={{padding:'16px 18px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                      <div><p style={{color:C.text,fontWeight:700,margin:0}}>{t.name}</p><p style={{color:C.sub,fontSize:11,margin:0}}>{t.member_count} membres · {t.frequency}</p></div>
                      <Badge status={t.status}/>
                    </div>
                    <p style={{color:C.gold,fontWeight:900,fontSize:18,fontFamily:'Syne,sans-serif',margin:'0 0 8px'}}>{fmt(t.total_collected)}</p>
                    <div style={{background:C.border,borderRadius:3,height:4}}><div style={{background:'linear-gradient(90deg,'+C.gold+','+C.goldL+')',width:Math.min(((t.current_tour||1)/(t.total_tours||1))*100,100)+'%',height:'100%',borderRadius:3}}/></div>
                    <p style={{color:C.sub,fontSize:10,margin:'4px 0 0'}}>Tour {t.current_tour||1} / {t.total_tours||1}</p>
                  </Card>;
                })}
              </div>
          }
        </div>
      )}
    </div>
  );
};

const Tontines = () => {
  const [tontines,setTontines] = useState([]);
  const [loading,setLoading] = useState(true);
  const [showCreate,setShowCreate] = useState(false);
  const [toast,setToast] = useState(null);
  const [name,setName] = useState('');
  const [amount,setAmount] = useState('');
  const [frequency,setFrequency] = useState('Mensuel');
  const [tours,setTours] = useState('');
  const showT = function(msg,type){setToast({msg,type:type||'success'});setTimeout(function(){setToast(null);},3000);};

  const load = function(){
    setLoading(true);
    api('GET','/api/tontines').then(function(r){setTontines(Array.isArray(r)?r:[]);}).catch(function(e){showT(e.message,'error');}).finally(function(){setLoading(false);});
  };
  useEffect(function(){load();},[]);

  const handleCreate = async function() {
    if(!name||!amount) return showT('Nom et montant obligatoires','error');
    try {
      await api('POST','/api/tontines',{name:name,amount:parseFloat(amount),frequency:frequency,total_tours:parseInt(tours)||1});
      showT('Tontine créée !');
      setShowCreate(false);
      setName(''); setAmount(''); setTours('');
      load();
    } catch(e) { showT(e.message,'error'); }
  };

  return (
    <div style={{padding:'28px',maxWidth:900}}>
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:22}}>
        <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:0}}>Mes Tontines</h1>
        <Btn onClick={function(){setShowCreate(!showCreate);}} style={{width:'auto',padding:'10px 18px'}}>+ Créer</Btn>
      </div>
      {showCreate && (
        <Card style={{padding:22,marginBottom:20}}>
          <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Nouveau groupe</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Inp label="Nom du groupe" value={name} onChange={setName} placeholder="Ex: Famille Diallo"/>
            <Inp label="Montant/tour (FCFA)" value={amount} onChange={setAmount} placeholder="Ex: 50000" type="number"/>
            <Inp label="Nombre de tours" value={tours} onChange={setTours} placeholder="Ex: 8" type="number"/>
            <div style={{marginBottom:14}}>
              <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>Fréquence</label>
              <select value={frequency} onChange={function(e){setFrequency(e.target.value);}} style={{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none'}}>
                <option>Hebdomadaire</option><option>Mensuel</option><option>Trimestriel</option>
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <Btn onClick={handleCreate} color={C.green}>✓ Créer</Btn>
            <Btn onClick={function(){setShowCreate(false);}} outline>Annuler</Btn>
          </div>
        </Card>
      )}
      {loading ? <Loader/> : tontines.length===0
        ? <Card style={{padding:60,textAlign:'center'}}><p style={{fontSize:40,marginBottom:10}}>◎</p><p style={{color:C.sub}}>Aucune tontine — créez-en une !</p></Card>
        : <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
            {tontines.map(function(t){
              return <Card key={t.id} style={{padding:'16px 18px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{display:'flex',gap:9,alignItems:'center'}}>
                    <div style={{width:40,height:40,borderRadius:11,background:C.gold+'20',display:'flex',alignItems:'center',justifyContent:'center',color:C.gold,fontWeight:900,fontSize:17}}>{t.name&&t.name[0]}</div>
                    <div><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{t.name}</p><p style={{color:C.sub,fontSize:11,margin:0}}>{t.member_count} membres · {t.frequency}</p></div>
                  </div>
                  <Badge status={t.status}/>
                </div>
                <p style={{color:C.gold,fontWeight:900,fontSize:18,fontFamily:'Syne,sans-serif',margin:'0 0 8px'}}>{fmt(t.total_collected)}</p>
                <div style={{background:C.border,borderRadius:3,height:4}}><div style={{background:'linear-gradient(90deg,'+C.gold+','+C.goldL+')',width:Math.min(((t.current_tour||1)/(t.total_tours||1))*100,100)+'%',height:'100%',borderRadius:3}}/></div>
                <p style={{color:C.sub,fontSize:10,margin:'4px 0 0'}}>Tour {t.current_tour||1} / {t.total_tours||1}</p>
              </Card>;
            })}
          </div>
      }
    </div>
  );
};

const ADMIN_NUMS = {wave:'0747429889',orange:'0555471974',mtn:'0747429889'};

const Paiements = () => {
  const [tab,setTab] = useState('payer');
  const [tontines,setTontines] = useState([]);
  const [transactions,setTransactions] = useState([]);
  const [loading,setLoading] = useState(false);
  const [toast,setToast] = useState(null);
  const [step,setStep] = useState(1);
  const [tontineId,setTontineId] = useState('');
  const [amount,setAmount] = useState('');
  const [method,setMethod] = useState('wave');
  const [phoneNum,setPhoneNum] = useState('');
  const showT = function(msg,type){setToast({msg,type:type||'success'});setTimeout(function(){setToast(null);},4000);};

  useEffect(function(){
    api('GET','/api/tontines').then(function(r){setTontines(Array.isArray(r)?r:[]);}).catch(function(){});
    api('GET','/api/payments/history').then(function(r){setTransactions(Array.isArray(r)?r:[]);}).catch(function(){});
  },[]);

  const handlePay = async function() {
    if(!amount||!phoneNum) return showT('Remplissez tous les champs','error');
    setLoading(true);
    try {
      const r = await api('POST','/api/payments/initiate',{tontine_id:tontineId||null,amount:parseFloat(amount),payment_method:method,phone_number:phoneNum});
      showT('✅ '+r.message);
      setStep(1); setAmount(''); setPhoneNum(''); setTontineId('');
      const p = await api('GET','/api/payments/history').catch(function(){return [];});
      setTransactions(Array.isArray(p)?p:[]);
      setTab('historique');
    } catch(e) { showT(e.message,'error'); }
    setLoading(false);
  };

  return (
    <div style={{padding:'28px',maxWidth:860}}>
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
      <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 22px'}}>Paiements</h1>
      <div style={{display:'flex',gap:8,marginBottom:22}}>
        {[['payer','↑ Payer'],['historique','📋 Historique']].map(function(item){
          return <button key={item[0]} onClick={function(){setTab(item[0]);setStep(1);}} style={{padding:'9px 18px',background:tab===item[0]?C.gold:C.card,border:'1.5px solid '+(tab===item[0]?C.gold:C.border),borderRadius:10,color:tab===item[0]?C.bg:C.sub,fontWeight:700,cursor:'pointer',fontSize:13}}>{item[1]}</button>;
        })}
      </div>
      {tab==='payer' && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22,alignItems:'start'}}>
          <Card style={{padding:22}}>
            <div style={{display:'flex',gap:5,marginBottom:20}}>
              {[1,2,3].map(function(s){return <div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?C.gold:C.border}}/>;}) }
            </div>
            {step===1 && (
              <div>
                <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Montant et Groupe</h3>
                <div style={{marginBottom:14}}>
                  <label style={{color:C.sub,fontSize:11,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.5}}>Groupe (optionnel)</label>
                  <select value={tontineId} onChange={function(e){setTontineId(e.target.value);}} style={{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:10,padding:'12px 14px',color:C.text,fontSize:14,outline:'none'}}>
                    <option value="">Paiement libre</option>
                    {tontines.map(function(t){return <option key={t.id} value={t.id}>{t.name} — {fmt(t.amount)}</option>;})}
                  </select>
                </div>
                <Inp label="Montant (FCFA)" value={amount} onChange={setAmount} placeholder="Ex: 50000" type="number"/>
                <Btn onClick={function(){if(!amount)return showT('Entrez un montant','error');setStep(2);}}>Suivant →</Btn>
              </div>
            )}
            {step===2 && (
              <div>
                <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Méthode de paiement</h3>
                {[{id:'wave',label:'Wave',color:C.wave,icon:'〰',num:ADMIN_NUMS.wave},{id:'orange',label:'Orange Money',color:C.orange,icon:'◍',num:ADMIN_NUMS.orange},{id:'mtn',label:'MTN MoMo',color:C.mtn,icon:'◈',num:ADMIN_NUMS.mtn}].map(function(m){
                  return <div key={m.id} onClick={function(){setMethod(m.id);}} style={{background:method===m.id?m.color+'15':C.bg,border:'1.5px solid '+(method===m.id?m.color:C.border),borderRadius:11,padding:'12px 14px',marginBottom:8,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{display:'flex',gap:9,alignItems:'center'}}>
                      <div style={{width:34,height:34,borderRadius:9,background:m.color+'25',display:'flex',alignItems:'center',justifyContent:'center',color:m.color,fontSize:17}}>{m.icon}</div>
                      <div><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{m.label}</p><p style={{color:C.sub,fontSize:10,margin:0}}>Admin: {m.num}</p></div>
                    </div>
                    <div style={{width:16,height:16,borderRadius:'50%',border:'2px solid '+(method===m.id?m.color:C.border),background:method===m.id?m.color:'transparent'}}/>
                  </div>;
                })}
                <Inp label="Votre numéro" value={phoneNum} onChange={setPhoneNum} placeholder="Ex: 0621234567" type="tel"/>
                <div style={{display:'flex',gap:8}}>
                  <Btn onClick={function(){setStep(1);}} outline style={{flex:1}}>←</Btn>
                  <Btn onClick={function(){if(!phoneNum)return showT('Entrez votre numéro','error');setStep(3);}} style={{flex:2}}>Suivant →</Btn>
                </div>
              </div>
            )}
            {step===3 && (
              <div>
                <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 14px',fontSize:15}}>Confirmer</h3>
                <Card style={{padding:14,marginBottom:12,background:C.bg}}>
                  {[['Montant',fmt(amount)],['Méthode',method.toUpperCase()],['Compte admin',ADMIN_NUMS[method]],['Votre numéro',phoneNum],['Frais','0 FCFA']].map(function(item){
                    return <div key={item[0]} style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{color:C.sub,fontSize:12}}>{item[0]}</span><span style={{color:C.text,fontWeight:700,fontSize:12}}>{item[1]}</span></div>;
                  })}
                  <div style={{borderTop:'1px solid '+C.border,paddingTop:9,display:'flex',justifyContent:'space-between'}}><span style={{color:C.text,fontWeight:800}}>Total</span><span style={{color:C.gold,fontWeight:900,fontSize:15}}>{fmt(amount)}</span></div>
                </Card>
                <div style={{display:'flex',gap:8}}>
                  <Btn onClick={function(){setStep(2);}} outline style={{flex:1}}>←</Btn>
                  <Btn onClick={handlePay} color={C.green} disabled={loading} style={{flex:2}}>{loading?'Traitement…':'✓ Confirmer'}</Btn>
                </div>
              </div>
            )}
          </Card>
          <Card style={{padding:18}}>
            <p style={{color:C.text,fontWeight:700,fontFamily:'Syne,sans-serif',margin:'0 0 10px',fontSize:14}}>Comptes administrateur</p>
            {[{m:'Wave',n:ADMIN_NUMS.wave,c:C.wave},{m:'Orange',n:ADMIN_NUMS.orange,c:C.orange},{m:'MTN',n:ADMIN_NUMS.mtn,c:C.mtn}].map(function(a){
              return <div key={a.m} style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{color:C.sub,fontSize:12}}>{a.m}</span><span style={{color:a.c,fontWeight:700,fontSize:13}}>{a.n}</span></div>;
            })}
          </Card>
        </div>
      )}
      {tab==='historique' && (transactions.length===0
        ? <Card style={{padding:50,textAlign:'center'}}><p style={{color:C.sub}}>Aucune transaction pour le moment</p></Card>
        : transactions.map(function(t){
          return <Card key={t.id} style={{padding:'13px 16px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <div style={{width:38,height:38,borderRadius:'50%',background:(t.status==='completed'?C.green:C.red)+'20',display:'flex',alignItems:'center',justifyContent:'center',color:t.status==='completed'?C.green:C.red,fontSize:17}}>{t.status==='completed'?'✓':'✗'}</div>
              <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{t.reference}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{t.payment_method&&t.payment_method.toUpperCase()} → {t.receiver_phone}</p></div>
            </div>
            <div style={{textAlign:'right'}}><p style={{color:C.text,fontWeight:700,margin:0,fontSize:13}}>{fmt(t.amount)}</p><Badge status={t.status}/></div>
          </Card>;
        })
      )}
    </div>
  );
};

const Admin = () => {
  const [stats,setStats] = useState(null);
  const [users,setUsers] = useState([]);
  const [loading,setLoading] = useState(true);
  const [tab,setTab] = useState('stats');

  useEffect(function(){
    Promise.all([
      api('GET','/api/admin/stats').catch(function(){return null;}),
      api('GET','/api/admin/users').catch(function(){return [];})
    ]).then(function(results){
      setStats(results[0]);
      setUsers(Array.isArray(results[1])?results[1]:[]);
    }).finally(function(){setLoading(false);});
  },[]);

  return (
    <div style={{padding:'28px',maxWidth:960}}>
      <h1 style={{color:C.text,fontSize:26,fontWeight:900,fontFamily:'Syne,sans-serif',margin:'0 0 22px'}}>Administration</h1>
      <div style={{display:'flex',gap:8,marginBottom:22}}>
        {[['stats',"Vue d'ensemble"],['users','Utilisateurs']].map(function(item){
          return <button key={item[0]} onClick={function(){setTab(item[0]);}} style={{padding:'9px 16px',background:tab===item[0]?C.gold:C.card,border:'1.5px solid '+(tab===item[0]?C.gold:C.border),borderRadius:10,color:tab===item[0]?C.bg:C.sub,fontWeight:700,cursor:'pointer',fontSize:13}}>{item[1]}</button>;
        })}
      </div>
      {loading ? <Loader/> : (
        <div>
          {tab==='stats' && stats && (
            <div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:22}}>
                {[['👥','Utilisateurs',stats.total_users,C.blue],['◎','Tontines actives',stats.active_tontines,C.green],['↕','Transactions',stats.total_transactions,C.gold],['💰','Volume',fmtS(stats.total_amount)+' FCFA',C.red]].map(function(item){
                  return <Card key={item[1]} style={{padding:'14px 16px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}><p style={{color:C.sub,fontSize:9,margin:0,textTransform:'uppercase',letterSpacing:.5}}>{item[1]}</p><span style={{fontSize:16}}>{item[0]}</span></div>
                    <p style={{color:item[3],fontSize:20,fontWeight:900,fontFamily:'Syne,sans-serif',margin:0}}>{item[2]}</p>
                  </Card>;
                })}
              </div>
              <h3 style={{color:C.text,fontFamily:'Syne,sans-serif',margin:'0 0 10px',fontSize:14}}>Comptes Admin</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
                {Object.entries(stats.admin_accounts||{}).map(function(entry){
                  var method=entry[0]; var num=entry[1];
                  var cols={wave:C.wave,orange:C.orange,mtn:C.mtn};
                  return <Card key={method} style={{padding:'14px 16px'}}>
                    <p style={{color:C.sub,fontSize:9,margin:'0 0 4px',textTransform:'uppercase'}}>{method}</p>
                    <p style={{color:cols[method]||C.gold,fontWeight:900,fontSize:15,fontFamily:'Syne,sans-serif',margin:'0 0 5px'}}>{num}</p>
                    <span style={{fontSize:9,padding:'2px 7px',borderRadius:6,background:C.green+'20',color:C.green}}>ACTIF</span>
                  </Card>;
                })}
              </div>
            </div>
          )}
          {tab==='users' && (
            <div>
              <p style={{color:C.sub,fontSize:13,marginBottom:12}}>{users.length} utilisateurs inscrits</p>
              {users.map(function(u){
                return <Card key={u.id} style={{padding:'12px 14px',marginBottom:7,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div style={{display:'flex',gap:9,alignItems:'center'}}>
                    <div style={{width:36,height:36,borderRadius:'50%',background:C.blue+'25',display:'flex',alignItems:'center',justifyContent:'center',color:C.text,fontWeight:700,fontSize:14}}>{u.name&&u.name[0]}</div>
                    <div><p style={{color:C.text,fontWeight:600,margin:0,fontSize:13}}>{u.name}</p><p style={{color:C.sub,fontSize:10,margin:0}}>{u.phone}</p></div>
                  </div>
                  <Badge status={u.is_active?'active':'paused'}/>
                </Card>;
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [screen,setScreen] = useState('splash');
  const [user,setUser] = useState(null);
  const [active,setActive] = useState('dashboard');

  useEffect(function(){
    setTimeout(async function(){
      var token = localStorage.getItem('td_token');
      if(token){
        try{
          var me = await api('GET','/api/auth/me');
          setUser(me);
          setScreen('app');
          return;
        }catch(e){ removeToken(); }
      }
      setScreen('auth');
    },1800);
  },[]);

  if(screen==='splash') return <Splash/>;
  if(screen==='auth') return <Auth onLogin={function(u){setUser(u);setScreen('app');}}/>;

  var panels = {
    dashboard:<Dashboard user={user} setActive={setActive}/>,
    tontines:<Tontines/>,
    paiements:<Paiements user={user}/>,
    admin:<Admin/>,
  };

  return (
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar active={active} setActive={setActive} user={user} onLogout={function(){removeToken();setUser(null);setScreen('auth');}}/>
      <main style={{flex:1,overflowY:'auto',minHeight:'100vh'}}>{panels[active]}</main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
