name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap config
        run: |
          mkdir -p android
          cat > android/twa-manifest.json << 'EOF'
          {
            "packageId": "com.tontine.digital",
            "host": "fofabdoul07.github.io",
            "name": "Tontine Digital",
            "launcherName": "Tontine",
            "display": "standalone",
            "themeColor": "#E8A020",
            "navigationColor": "#060E1A",
            "backgroundColor": "#060E1A",
            "startUrl": "/tontine-app/",
            "iconUrl": "https://fofabdoul07.github.io/tontine-app/icon.png",
            "maskableIconUrl": "https://fofabdoul07.github.io/tontine-app/icon.png",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "android.keystore",
              "alias": "tontine"
            },
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": false,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://fofabdoul07.github.io/tontine-app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": false,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://fofabdoul07.github.io/tontine-app/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          EOF

      - name: Generate Keystore
        run: |
          cd android
          keytool -genkey -v \
            -keystore android.keystore \
            -alias tontine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tontine123 \
            -keypass tontine123 \
            -dname "CN=Tontine Digital, OU=Mobile, O=Tontine, L=Conakry, S=Conakry, C=GN" \
            -noprompt

      - name: Build APK
        run: |
          cd android
          bubblewrap build \
            --skipPwaValidation \
            --manifest twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: tontine123
          BUBBLEWRAP_KEY_PASSWORD: tontine123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tontine-digital-apk
          path: android/app-release-signed.apk
