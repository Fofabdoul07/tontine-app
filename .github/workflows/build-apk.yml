name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap
        run: |
          bubblewrap init \
            --manifest="https://fofabdoul07.github.io/tontine-app/manifest.json" \
            --directory=./android

      - name: Build APK
        run: |
          cd android
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tontine-digital
          path: android/app-release-signed.apk
